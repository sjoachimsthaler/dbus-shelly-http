[DEFAULT]
CustomName = Growatt NEO 2000
DeviceInstance = 41
# Role: pvinverter
Role = pvinverter
# Available Postions: 0 = AC, 1 = AC-Out 1, AC-Out 2
Position = 0
# Phase the inverter feeds in: 1, 2 or 3
Phase = 1
# Time in minutes how often a status is added to the log-file
SignOfLifeLog = 1
# Available values see https://docs.python.org/3/library/logging.html#levels
LogLevel = ERROR

[ONPREMISE]
# IP or hostname of the Shelly Plug S (Gen1)
Host =
# 1 = Shelly Plug S Gen1 (/status), 2 = Plus Plug S and newer (Gen2/Gen3, /rpc)
Generation = 1
# Leave blank if no restricted login is configured on the plug
Username =
Password =
# Gen1 plugs report no voltage - fixed value used for voltage and current calculation (Gen2: fallback only)
Voltage = 230
